<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#081119" />
    </linearGradient>

    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#bgGrad)" />
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1400" cy="80" r="220" fill="#0ea5e9" opacity="0.16" filter="url(#glow)" />
  <circle cx="1200" cy="320" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="450" cy="60" r="160" fill="#0284c7" opacity="0.10" filter="url(#glow)" />

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="1584" height="4" fill="url(#cyanGreenGrad)" />

  <!-- Decorative Neural Network / Circuit Nodes (Right Half) -->
  <g opacity="0.85" transform="translate(1080, 50)">
    <!-- Circuit connection lines -->
    <line x1="20" y1="60" x2="140" y2="60" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7" />
    <line x1="140" y1="60" x2="200" y2="130" stroke="#2dd4bf" stroke-width="2" opacity="0.8" />
    <line x1="200" y1="130" x2="340" y2="130" stroke="#34d399" stroke-width="2" opacity="0.9" />
    
    <line x1="60" y1="200" x2="180" y2="200" stroke="#0ea5e9" stroke-width="1.8" opacity="0.6" />
    <line x1="180" y1="200" x2="250" y2="110" stroke="#2dd4bf" stroke-width="1.8" opacity="0.7" />
    <line x1="250" y1="110" x2="320" y2="110" stroke="#38bdf8" stroke-width="1.8" opacity="0.7" />

    <line x1="140" y1="60" x2="240" y2="220" stroke="#67e8f9" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5" />
    <line x1="240" y1="220" x2="360" y2="220" stroke="#34d399" stroke-width="1.5" opacity="0.7" />

    <!-- Nodes with glowing dots -->
    <circle cx="20" cy="60" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="140" cy="60" r="7" fill="#2dd4bf" />
    <circle cx="200" cy="130" r="9" fill="#34d399" filter="url(#glow)" />
    <circle cx="340" cy="130" r="6" fill="#34d399" />
    <circle cx="60" cy="200" r="5" fill="#0ea5e9" />
    <circle cx="180" cy="200" r="7" fill="#2dd4bf" />
    <circle cx="250" cy="110" r="6" fill="#38bdf8" />
    <circle cx="320" cy="110" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="240" cy="220" r="5" fill="#67e8f9" />
    <circle cx="360" cy="220" r="7" fill="#34d399" filter="url(#glow)" />

    <!-- Code Block / Terminal Card Illustration -->
    <rect x="110" y="25" width="230" height="190" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <circle cx="132" cy="45" r="4.5" fill="#ef4444" opacity="0.85" />
    <circle cx="148" cy="45" r="4.5" fill="#eab308" opacity="0.85" />
    <circle cx="164" cy="45" r="4.5" fill="#22c55e" opacity="0.85" />
    
    <rect x="130" y="65" width="90" height="8" rx="4" fill="#38bdf8" opacity="0.9" />
    <rect x="130" y="82" width="140" height="6.5" rx="3" fill="#94a3b8" opacity="0.6" />
    <rect x="142" y="98" width="160" height="6.5" rx="3" fill="#34d399" opacity="0.8" />
    <rect x="142" y="114" width="120" height="6.5" rx="3" fill="#a78bfa" opacity="0.7" />
    <rect x="130" y="132" width="70" height="6.5" rx="3" fill="#38bdf8" opacity="0.7" />
    <rect x="130" y="148" width="150" height="6.5" rx="3" fill="#64748b" opacity="0.6" />
    
    <rect x="130" y="170" width="115" height="24" rx="6" fill="url(#cyanGreenGrad)" fill-opacity="0.25" stroke="#2dd4bf" stroke-width="1" />
    <text x="187" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#2dd4bf" text-anchor="middle">AI &amp; WEB BUILDER</text>
  </g>

  <!-- Left Side Typography (Carefully positioned to avoid mobile avatar overlap) -->
  <!-- Note: LinkedIn mobile/desktop avatar overlaps bottom-left ~0-350px width, so main text is placed starting at x=420px -->
  <g transform="translate(420, 95)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">
      ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE
    </text>

    <!-- Name Header -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.8">
      MANIKKAVEL S
    </text>

    <!-- Subtitle / Motto -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="url(#subtextGrad)" letter-spacing="0.5">
      Building â€¢ Learning â€¢ Creating
    </text>

    <!-- Tech Keywords Row -->
    <g transform="translate(0, 162)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="67" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">âš¡ Full-Stack Web</text>

      <!-- Tag 2 -->
      <rect x="147" y="0" width="145" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="219" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">ðŸ¤– AI &amp; Gemini API</text>

      <!-- Tag 3 -->
      <rect x="304" y="0" width="155" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="381" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#67e8f9" text-anchor="middle">ðŸ—„ï¸ PostgreSQL &amp; SQL</text>

      <!-- Tag 4 -->
      <rect x="471" y="0" width="150" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="546" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" text-anchor="middle">ðŸ“ Tamil Nadu, India</text>
    </g>
  </g>
</svg>