    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Hi, I'm Manikkavel S <tspan fill="#38bdf8">ðŸ‘‹</tspan>
    </text>

