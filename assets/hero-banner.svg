      <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">âš¡ Full-Stack Web</text>

      <!-- Badge 2: AI & Gemini -->
      <rect x="140" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.75" />
      <text x="210" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">ðŸ¤– Gemini AI Integration</text>

      <!-- Badge 3: PostgreSQL & Supabase -->
      <rect x="290" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.75" />
      <text x="365" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">ðŸ—„ï¸ PostgreSQL &amp; Supabase</text>

      <!-- Badge 4: Tamil Nadu, IN -->
      <rect x="450" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.75" />
      <text x="522" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">ðŸ“ Tamil Nadu, India</text>
    </g>
