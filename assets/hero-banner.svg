<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#09121a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="60" r="160" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="240" r="140" fill="#10b981" opacity="0.10" filter="url(#glow)" />
  <circle cx="600" cy="140" r="180" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Outer Border Stroke -->
  <rect width="1198" height="278" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <path d="M 16 2 Q 600 2 1184 2" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Decorative Tech Geometry (Right Side) -->
  <g opacity="0.75" transform="translate(860, 40)">
    <!-- Circuit Lines & Nodes -->
    <line x1="20" y1="50" x2="120" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <line x1="120" y1="50" x2="170" y2="100" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <line x1="170" y1="100" x2="260" y2="100" stroke="#34d399" stroke-width="1.5" opacity="0.8" />
    
    <line x1="60" y1="130" x2="140" y2="130" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" />
    <line x1="140" y1="130" x2="190" y2="80" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6" />
    <line x1="190" y1="80" x2="240" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.7" />

    <!-- Node Circles -->
    <circle cx="20" cy="50" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="120" cy="50" r="5" fill="#2dd4bf" />
    <circle cx="170" cy="100" r="6" fill="#34d399" filter="url(#glow)" />
    <circle cx="260" cy="100" r="4" fill="#34d399" />
    <circle cx="60" cy="130" r="4" fill="#0ea5e9" />
    <circle cx="140" cy="130" r="5" fill="#2dd4bf" />
    <circle cx="190" cy="80" r="4" fill="#38bdf8" />
    <circle cx="240" cy="80" r="5" fill="#38bdf8" filter="url(#glow)" />

    <!-- Code Block / Card Bracket Mockup -->
