    <circle cx="86" cy="30" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="98" cy="30" r="3.5" fill="#eab308" opacity="0.8" />
    <circle cx="110" cy="30" r="3.5" fill="#22c55e" opacity="0.8" />
    
    <rect x="85" y="46" width="70" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="85" y="60" width="110" height="5" rx="2.5" fill="#94a3b8" opacity="0.5" />
    <rect x="95" y="72" width="130" height="5" rx="2.5" fill="#34d399" opacity="0.7" />
    <rect x="95" y="84" width="90" height="5" rx="2.5" fill="#a78bfa" opacity="0.6" />
    <rect x="85" y="98" width="50" height="5" rx="2.5" fill="#38bdf8" opacity="0.6" />
    <rect x="85" y="112" width="120" height="5" rx="2.5" fill="#64748b" opacity="0.5" />
    <rect x="85" y="130" width="80" height="18" rx="5" fill="url(#accentGrad)" opacity="0.2" stroke="#2dd4bf" stroke-width="0.75" />
    <text x="125" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#2dd4bf" text-anchor="middle">ACTIVE REPOS â€¢ 4</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 52)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" opacity="0.9" />
